# macOS CI (M1 step 3 and M3 of docs/PORTING_PLAN.md): builds and caches the third-party libraries for both Mac architectures,
# reports what the Apple toolchain accepts and builds and tests zen/. FreeFileSync itself does not build on macOS yet (M3 step 3+).
#
# - "Toolchain report" (informational): Xcode's clang and Homebrew LLVM against the C++ dialect and the platform-
#   independent zen code, and the oldest deployment target per C++ library feature (.github/build/macos-report.sh).
# - "Libraries (<arch>)": OpenSSL, libssh2, libidn2, libcurl and wxWidgets (wxOSX/Cocoa) as static libraries with the
#   .github/build scripts (FFS_TARGET=macos-<arch>), arm64 natively and x86_64 cross-compiled on the same arm64 runner,
#   cached like the Linux libraries. Uploads one archive per architecture with the build log and a manifest. The same job
#   builds sentry-native (crash reporting for FFS_SENTRY=1 builds, .github/build/build-sentry-native.sh) against those
#   libraries, cached on its own, then compiles all of zen/ against the libraries and runs the zen unit tests (M3 steps 1, 2).
#
# Later stages slot in after "Libraries": a job per architecture that builds FreeFileSync.app and RealTimeSync.app
# against the cached libraries (needs: libraries), and a "wrap-mac-dmg" job that turns each .app into a .dmg and uploads
# one artifact per architecture with archive: false (the shape of Musikku's desktop-package.yml).
name: macOS build

on:
  push:
    branches: [main, dev] # feature branches are built by their pull requests
    paths: &build-paths
      - ".github/build/**"
      - ".github/workflows/macos-build.yml"
      - "Bugs.txt"
      - "FreeFileSync/Source/**"
      - "zen/**"
      - "Tests/zen/**"
      - "wx+/**"
      - "zenXml/**"
      - "libcurl/**"
      - "libssh2/**"
      - "xBRZ/**"
  pull_request:
    paths: *build-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolchain:
    name: Toolchain report
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # informational only: a missing Homebrew LLVM just leaves its part of the report empty
      - name: Install Homebrew LLVM
        continue-on-error: true
        run: brew install llvm

      - name: Toolchain report
        continue-on-error: true
        run: |
          {
            echo "Xcode installations: $(ls -d /Applications/Xcode*.app 2>/dev/null | xargs -n 1 basename | tr '\n' ' ')"
            echo "selected: $(xcode-select -p)"
            .github/build/macos-report.sh toolchain
          } 2>&1 | tee toolchain-report.txt
          { echo '```'; cat toolchain-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: toolchain-report.txt
          archive: false
          if-no-files-found: ignore

  libraries:
    name: Libraries (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64] # x86_64 is cross-compiled on the arm64 runner
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FFS_TARGET: macos-${{ matrix.arch }}
      # Xcode's clang from the newest Xcode 26.x on the runner image, selected in the first step (decided from the
      # toolchain report: it accepts C++26, its libc++ 20 has std::jthread, and only floating-point from_chars needs a
      # fallback, so no C++ runtime has to ship with the app). The libraries are built with the compiler the apps will use;
      # its version and SDK are part of the cache key.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26.x on this runner image; installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $xcode"

      # the build scripts need bash 4+ and GNU coreutils/flock (macOS has bash 3.2 and BSD tools)
      - name: Install build tools
        run: |
          brew install bash coreutils flock pkgconf make # make: GNU make 4 ("gmake") for the makefiles; macOS has 3.81
          bash --version | sed -n 1p
          echo "MACOSX_DEPLOYMENT_TARGET in common.sh: $(sed -nE 's/^FFS_MACOS_DEPLOYMENT_TARGET=([0-9.]+).*/\1/p' .github/build/common.sh)"

      - name: Identify the compiler
        id: compiler
        run: |
          xcodebuild -version
          clang++ --version
          echo "id=$(clang++ --version | sed -n 1p | tr -c 'A-Za-z0-9.\n' '-')-sdk$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"

      # restore and save are separate steps so the libraries are kept even when a later step fails
      - name: Restore libraries
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build/deps/macos-${{ matrix.arch }}
          # the compiler, SDK and every script and patch that decides how the libraries are built
          key: deps-macos-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('.github/build/common.sh', '.github/build/build.sh', '.github/build/build-openssl.sh', '.github/build/build-libssh2.sh', '.github/build/build-libidn2.sh', '.github/build/build-curl.sh', '.github/build/build-wxwidgets.sh', '.github/build/patches/**') }}

      - name: Build libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/build/build.sh 2>&1 | tee build.log

      - name: Save libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/deps/macos-${{ matrix.arch }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # sentry-native: its own prefix and cache (.build/sentry/<target>), keyed on everything the libraries' key has plus
      # its script, because it is built against the libcurl in the prefix above
      - name: Restore sentry-native
        id: sentry-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/sentry/macos-${{ matrix.arch }}
          key: sentry-macos-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('.github/build/common.sh', '.github/build/build.sh', '.github/build/build-openssl.sh', '.github/build/build-libssh2.sh', '.github/build/build-libidn2.sh', '.github/build/build-curl.sh', '.github/build/build-wxwidgets.sh', '.github/build/build-sentry-native.sh', '.github/build/patches/**') }}

      - name: Build sentry-native
        if: steps.sentry-cache.outputs.cache-hit != 'true'
        run: .github/build/build-sentry-native.sh 2>&1 | tee sentry-build.log

      - name: Save sentry-native
        if: steps.sentry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/sentry/macos-${{ matrix.arch }}
          key: ${{ steps.sentry-cache.outputs.cache-primary-key }}

      # fails the job if a library is missing, has another architecture or another deployment target (also on a cache hit)
      - name: Check libraries and write the manifest
        run: |
          prefix=".build/deps/macos-${{ matrix.arch }}"
          target="$(sed -nE 's/^FFS_MACOS_DEPLOYMENT_TARGET=([0-9.]+).*/\1/p' .github/build/common.sh)"
          {
            echo "target: macos-${{ matrix.arch }}, deployment target $target"
            echo "compiler: $(clang++ --version | sed -n 1p), SDK $(xcrun --show-sdk-version)"
            echo "installed (stamps):"
            ls "$prefix/.stamps" | sed 's/^/    /'
            echo "libraries:"
          } > manifest.txt
          for lib in libssl libcrypto libssh2 libidn2 libcurl; do
            test -f "$prefix/lib/$lib.a" || { echo "::error::$lib.a is missing"; exit 1; }
          done
          for file in "$prefix"/lib/*.a; do
            archs="$(lipo -archs "$file")"
            # awk reads all of otool's output: exiting early could kill otool with SIGPIPE, fatal under pipefail
            minos="$(otool -l "$file" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" && !done { print $2; done = 1 }')"
            echo "    $(basename "$file"): $archs, minos $minos" >> manifest.txt
            [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::$file is built for $archs"; exit 1; }
            [ "$minos" = "$target" ] || { echo "::error::$file is built for macOS $minos, not $target"; exit 1; }
          done
          if ls "$prefix"/lib/*.dylib >/dev/null 2>&1; then echo "::error::shared libraries in the prefix:"; ls "$prefix"/lib/*.dylib; exit 1; fi
          # sentry-native: static libraries and crashpad_handler for the target architecture and deployment target
          sentry=".build/sentry/macos-${{ matrix.arch }}"
          echo "sentry-native $(sed -n 's/^Version: //p' "$sentry/lib/pkgconfig/sentry-native.pc"):" >> manifest.txt
          for file in "$sentry"/lib/lib{sentry,crashpad_client,crashpad_util,mini_chromium}.a "$sentry/bin/crashpad_handler"; do
            test -f "$file" || { echo "::error::$file is missing"; exit 1; }
            archs="$(lipo -archs "$file")"
            minos="$(otool -l "$file" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" && !done { print $2; done = 1 }')"
            echo "    $(basename "$file"): $archs, minos $minos" >> manifest.txt
            [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::$file is built for $archs"; exit 1; }
            [ "$minos" = "$target" ] || { echo "::error::$file is built for macOS $minos, not $target"; exit 1; }
          done
          echo "wx-config: $("$prefix/bin/wx-config" --version) $("$prefix/bin/wx-config" --selected-config)" >> manifest.txt
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
          echo "libcurl $(pkg-config --modversion libcurl 2>&1), static link flags: $(pkg-config --static --libs libcurl 2>&1)" >> manifest.txt
          cat manifest.txt

      # zen/ against the libraries above (http.cpp, open_ssl.cpp, socket.h need curl, OpenSSL, libidn2): every file, all errors
      - name: Compile zen
        run: .github/build/macos-report.sh zen-compile ${{ matrix.arch }} ".build/deps/macos-${{ matrix.arch }}" 2>&1 | tee zen-compile-${{ matrix.arch }}.txt

      # the engine (afs/, base/, the non-UI files of FreeFileSync/Source, zen/) as libffs_engine.a with the makefile (M3 step 3);
      # -k: every file that fails, not just the first
      - name: Engine library
        run: |
          set -o pipefail
          gmake -C FreeFileSync/Source -k -j"$(sysctl -n hw.ncpu)" engine ARCH=${{ matrix.arch }} objPath="$RUNNER_TEMP/engine-obj" 2>&1 | tee engine-${{ matrix.arch }}.txt
          lib="$RUNNER_TEMP/engine-obj/libffs_engine.a"
          ls -l "$lib"
          lipo -archs "$lib"

      # the zen unit tests (also run by zen-tests.yml); x86_64 runs under Rosetta 2, or is only compiled without it
      - name: zen tests
        env:
          ARCH: ${{ matrix.arch }}
          ZEN_TEST_ALL_ERRORS: 1
        run: |
          if [ "$ARCH" = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 not available: x86_64 zen tests are compiled only"
            export ZEN_TEST_COMPILE_ONLY=1
          fi
          bash Tests/zen/run.sh

      - name: Upload zen compile log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: zen-compile-${{ matrix.arch }}.txt
          archive: false
          if-no-files-found: ignore

      - name: Upload engine build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: engine-${{ matrix.arch }}.txt
          archive: false
          if-no-files-found: ignore

      - name: Pack build log and manifest
        if: always()
        run: |
          touch build.log sentry-build.log manifest.txt
          tar czf macos-libraries-${{ matrix.arch }}.tar.gz build.log sentry-build.log manifest.txt

      - name: Upload build log and manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: macos-libraries-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error
