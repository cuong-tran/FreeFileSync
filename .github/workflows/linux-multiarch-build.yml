# Builds FreeFileSync and RealTimeSync from the checked-in sources on Linux for amd64 and arm64
# and uploads the binaries as workflow artifacts.
#
# Adapted from the Geeeeeker fork (https://github.com/Geeeeeker/FreeFileSync).
# Run it by hand from the Actions tab; it also runs on pull requests that touch this workflow or the Makefiles.
#
# Library setup follows Bugs.txt: wxWidgets is built from source with the settings.h color hook
# that wx+/darkmode.cpp needs and without exception handling (application.cpp has an #error for that),
# and the MAX_SFTP_* constants that afs/sftp.cpp expects are added to the installed libssh2_sftp.h.
# The other Bugs.txt patches only change runtime behavior and are not applied.

name: Linux multi-arch build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - arm64
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/linux-multiarch-build.yml'
      - 'FreeFileSync/Source/Makefile'
      - 'FreeFileSync/Source/RealTimeSync/Makefile'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WX_VERSION: '3.3.4'
  WX_SHA256: '815c16cafa4fcbfcf25c5c0a3418309c62257b8a3b6f91d85a1367a134f98c98'
  WX_PREFIX: /opt/wx
  # bump WX_CACHE_REV whenever the wxWidgets patch or configure options below change
  WX_CACHE_REV: 1

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.arch == 'all') && '["amd64","arm64"]' || format('["{0}"]', inputs.arch)) }}
    # native runners for both architectures; the container provides a GCC recent enough for -std=c++26
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:26.04
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git bzip2 make g++ pkg-config perl \
            libgtk-3-dev libssl-dev libcurl4-openssl-dev libssh2-1-dev libidn2-dev libselinux1-dev
          g++ --version

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MAX_SFTP_* constants to libssh2_sftp.h (Bugs.txt)
        run: |
          header=$(pkg-config --variable=includedir libssh2)/libssh2_sftp.h
          test -f "$header"
          if ! grep -q 'define MAX_SFTP_OUTGOING_SIZE' "$header"; then
            printf '\n#ifndef MAX_SFTP_OUTGOING_SIZE\n#define MAX_SFTP_OUTGOING_SIZE 30000\n#endif\n#ifndef MAX_SFTP_READ_SIZE\n#define MAX_SFTP_READ_SIZE 30000\n#endif\n' >> "$header"
          fi
          grep -n 'MAX_SFTP_' "$header"

      # restore and save are separate steps so a wxWidgets build is kept even when the FreeFileSync build fails
      - name: Restore wxWidgets build
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WX_PREFIX }}
          key: wx-${{ env.WX_VERSION }}-rev${{ env.WX_CACHE_REV }}-ubuntu26.04-${{ matrix.arch }}

      - name: Build wxWidgets ${{ env.WX_VERSION }} (patched per Bugs.txt)
        if: steps.wx-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o wx.tar.bz2 "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
          echo "${WX_SHA256}  wx.tar.bz2" | sha256sum -c -
          tar -xjf wx.tar.bz2
          cd "wxWidgets-${WX_VERSION}"

          # Bugs.txt, /include/wx/settings.h: global color hook for dark mode support (used by wx+/darkmode.cpp)
          perl -0pi -e '
            my $hook = "#include <memory>\n\n"
                     . "struct wxColorHook\n{\n    virtual ~wxColorHook() {}\n    virtual wxColor getColor(wxSystemColour index) const = 0;\n};\n"
                     . "WXDLLIMPEXP_CORE inline std::unique_ptr<wxColorHook>& refGlobalColorHook()\n{\n    static std::unique_ptr<wxColorHook> globalColorHook;\n    return globalColorHook;\n}\n\n";
            my $getColour = "    static wxColour GetColour(wxSystemColour index)\n    {\n        if (refGlobalColorHook())\n            return refGlobalColorHook()->getColor(index);\n\n        return wxSystemSettingsNative::GetColour(index);\n    }\n";
            s/(class WXDLLIMPEXP_CORE wxSystemSettings : public wxSystemSettingsNative\n\{\npublic:\n)/$hook$1$getColour/ or die "settings.h patch did not apply\n";
          ' include/wx/settings.h
          grep -q 'refGlobalColorHook' include/wx/settings.h

          mkdir gtk-build
          cd gtk-build
          ../configure --prefix="$WX_PREFIX" --with-gtk=3 --disable-shared --disable-exceptions \
            --disable-webview --disable-mediactrl --without-opengl --without-libnotify \
            --with-libpng=builtin --with-libjpeg=builtin --with-libtiff=builtin --with-libwebp=builtin \
            --with-zlib=builtin --with-expat=builtin --with-regex=builtin
          make -j"$(nproc)"
          make install

      - name: Save wxWidgets build
        if: steps.wx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WX_PREFIX }}
          key: wx-${{ env.WX_VERSION }}-rev${{ env.WX_CACHE_REV }}-ubuntu26.04-${{ matrix.arch }}

      - name: Check wxWidgets configuration
        run: |
          echo "$WX_PREFIX/bin" >> "$GITHUB_PATH"
          "$WX_PREFIX/bin/wx-config" --version
          "$WX_PREFIX/bin/wx-config" --selected-config
          grep -rq 'refGlobalColorHook' "$WX_PREFIX/include"
          # application.cpp refuses to compile against a wxWidgets with exception handling enabled
          grep -rE '#define wxUSE_EXCEPTIONS +0' "$WX_PREFIX/lib/wx/include"

      - name: Build FreeFileSync
        run: make -C FreeFileSync/Source -j"$(nproc)"

      - name: Build RealTimeSync
        run: make -C FreeFileSync/Source/RealTimeSync -j"$(nproc)"

      - name: List binaries
        run: |
          ls -l FreeFileSync/Build/Bin
          for bin in FreeFileSync/Build/Bin/FreeFileSync_* FreeFileSync/Build/Bin/RealTimeSync_*; do
            test -x "$bin"
            echo "== $bin"
            ldd "$bin" | grep -E 'curl|ssh2|ssl|idn2|gtk-3' || true
          done

      # upload-artifact zips files without Unix permissions, so pack the binaries into a tarball to keep them executable
      - name: Pack binaries
        run: tar -czvf "FreeFileSync-linux-${{ matrix.arch }}.tar.gz" -C FreeFileSync/Build/Bin .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: FreeFileSync-linux-${{ matrix.arch }}
          path: FreeFileSync-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
