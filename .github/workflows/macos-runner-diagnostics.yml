# What the self-hosted macOS runner (the owner's own Mac, label "self-hosted") offers the macOS jobs: architecture, macOS and
# Xcode versions, the tools the build scripts need, Rosetta 2, the window server session and the permissions the start checks
# use, free disk space; and a test that mac-runner.sh cleanup ends a process started from the checkout by a relative path.
# It installs nothing and changes no setting; like every macOS job it masks private names before the checkout, starts with
# mac-runner.sh setup and ends with mac-runner.sh cleanup, and prints nothing private (no listing of the home folder or of
# /Applications beyond the Xcode bundles, no environment dump, no security settings). Manual runs only (workflow_dispatch).
name: macOS runner diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Self-hosted macOS runner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0} # the system's bash 3.2: Homebrew's may not be there
    steps:
      - name: Mask private names
        run: |
          for v in "$(id -un)" "$(id -F 2>/dev/null || true)" "$(hostname -s 2>/dev/null || true)" "$(hostname 2>/dev/null || true)" \
                   "$(scutil --get ComputerName 2>/dev/null || true)" "$(scutil --get LocalHostName 2>/dev/null || true)"; do
            if [ "${#v}" -ge 3 ]; then echo "::add-mask::$v"; fi
          done

      - uses: actions/checkout@v4

      # outputs only (no tool needs: this run is to find out what is there), TMPDIR in $RUNNER_TEMP, state for cleanup
      - name: Prepare the runner
        id: runner
        run: .github/build/mac-runner.sh setup

      - name: System
        run: |
          echo "uname -m: $(uname -m), sysctl.proc_translated: $(sysctl -n sysctl.proc_translated 2>/dev/null || echo n/a)"
          sw_vers
          echo "CPU cores: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          echo "runner: os $RUNNER_OS, arch $RUNNER_ARCH, environment ${{ runner.environment }}"
          inHome=no; case "$GITHUB_WORKSPACE" in ("$HOME"/*) inHome=yes;; esac; echo "work folder inside the home folder: $inHome"
          df -h "$GITHUB_WORKSPACE" | awk 'NR == 2 { print "disk of the work folder: " $2 " size, " $4 " free, " $5 " used" }'
          probe="$RUNNER_TEMP/CaseProbe"; rm -f "$probe" "$RUNNER_TEMP/caseprobe"; touch "$probe"
          if [ -e "$RUNNER_TEMP/caseprobe" ]; then echo "case-insensitive file system"; else echo "case-SENSITIVE file system"; fi
          rm -f "$probe"
          # mac-runner.sh setup points TMPDIR into $RUNNER_TEMP: does mktemp follow it here?
          echo "TMPDIR: $(sed "s#^$RUNNER_TEMP#<runner temp>#" <<< "${TMPDIR:-unset}"), exists: $([ -d "${TMPDIR:-/nonexistent}" ] && echo yes || echo no)"
          t="$(mktemp -d)"; echo "mktemp -d: $(sed -e "s#^$RUNNER_TEMP#<runner temp>#" -e "s#^/private/var/folders/.*#<per-user temp folder>/...#" -e "s#^/var/folders/.*#<per-user temp folder>/...#" <<< "$t")"; rmdir "$t"
          t="$(/usr/bin/env bash -c 'mktemp -d')"; echo "mktemp -d from bash on PATH: $(sed -e "s#^$RUNNER_TEMP#<runner temp>#" -e "s#^/private/var/folders/.*#<per-user temp folder>/...#" -e "s#^/var/folders/.*#<per-user temp folder>/...#" <<< "$t")"; rmdir "$t"

      - name: Xcode
        run: |
          echo "xcode-select -p: $(xcode-select -p 2>/dev/null || echo none)"
          echo "Xcode bundles in /Applications:"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            dev="$app/Contents/Developer"
            ver="$(DEVELOPER_DIR="$dev" xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
            clang="$(DEVELOPER_DIR="$dev" xcrun clang++ --version 2>/dev/null | sed -n 1p || true)"
            sdk="$(DEVELOPER_DIR="$dev" xcrun --show-sdk-version 2>/dev/null || true)"
            cxx26=no
            if echo 'int main() {}' | DEVELOPER_DIR="$dev" xcrun clang++ -std=c++26 -x c++ -fsyntax-only - 2>/dev/null; then cxx26=yes; fi
            libcxx="$(echo '#include <version>' | DEVELOPER_DIR="$dev" xcrun clang++ -std=c++2c -x c++ -dM -E - 2>/dev/null | awk '$2 == "_LIBCPP_VERSION" { print $3 }' || true)"
            echo "    $(basename "$app"): ${ver:-xcodebuild failed (license not accepted, first launch not done?)}; $clang; SDK $sdk; -std=c++26: $cxx26; libc++ $libcxx"
          done
          echo "command line tools clang -std=c++26: $(echo 'int main() {}' | /Library/Developer/CommandLineTools/usr/bin/clang++ -std=c++26 -x c++ -fsyntax-only - 2>/dev/null && echo accepted || echo rejected)"
          echo "default toolchain: $(xcrun clang++ --version 2>/dev/null | sed -n 1p || echo none)"
          xcodebuild -version 2>&1 || true

      - name: Tools
        run: |
          echo "PATH entries: $(echo "$PATH" | tr ':' '\n' | sed "s#^$HOME#~#" | tr '\n' ' ')"
          if command -v brew >/dev/null; then
            echo "brew: $(brew --version | sed -n 1p), prefix $(brew --prefix)"
            prefix="$(brew --prefix)"
          else
            echo "brew: not found"; prefix=/opt/homebrew
          fi
          echo "bash on PATH: $(bash --version | sed -n 1p)"
          for b in "$prefix/bin/bash" /usr/local/bin/bash /opt/homebrew/bin/bash; do [ -x "$b" ] && echo "    $b: $("$b" --version | sed -n 1p)"; done
          echo "coreutils gnubin: $([ -d "$prefix/opt/coreutils/libexec/gnubin" ] && echo yes || echo no)"
          for tool in gmake flock pkg-config pkgconf ccache create-dmg python3 zip unzip gtimeout gsha256sum grealpath git curl perl cmake ninja xz bzip2 patch sentry-cli; do
            path="$(command -v "$tool" 2>/dev/null || true)"
            if [ -z "$path" ]; then echo "    $tool: MISSING"; continue; fi
            case "$tool" in
              python3) v="$("$path" --version 2>&1 || true)" ;;
              create-dmg) v="$("$path" --version 2>&1 | sed -n 1p || true)" ;;
              zip|unzip) v="$("$path" -v 2>&1 | sed -n 2p || true)" ;;
              *) v="$("$path" --version 2>&1 | sed -n 1p || true)" ;;
            esac
            echo "    $tool: $(echo "$path" | sed "s#^$HOME#~#") ($v)"
          done
          echo "/usr/bin/python3 usable: $(/usr/bin/python3 -c 'print("yes")' 2>/dev/null || echo no)"

      - name: Rosetta 2
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then echo "x86_64 runs (Rosetta 2 or Intel)"; else echo "x86_64 does NOT run"; fi
          if arch -arm64 /usr/bin/true 2>/dev/null; then echo "arm64 runs"; else echo "arm64 does NOT run"; fi

      - name: GUI session and permissions
        run: |
          echo "launchctl managername: $(launchctl managername 2>/dev/null || true)"
          echo "console user is the runner user: $([ "$(stat -f %Su /dev/console)" = "$(id -un)" ] && echo yes || echo no)"
          echo "screen locked or asleep cannot be read without private APIs; display count: $(system_profiler SPDisplaysDataType 2>/dev/null | grep -c 'Resolution:' || true)"
          # no prompt: Preflight only reads the state; AXIsProcessTrusted likewise
          osascript -l JavaScript -e "ObjC.import('CoreGraphics'); ObjC.import('ApplicationServices');
            ObjC.bindFunction('CGPreflightScreenCaptureAccess', ['bool', []]); ObjC.bindFunction('AXIsProcessTrusted', ['bool', []]);
            var list = ObjC.deepUnwrap(ObjC.castRefToObject(\$.CGWindowListCopyWindowInfo(\$.kCGWindowListOptionOnScreenOnly, 0))) || [];
            'screen recording (CGPreflightScreenCaptureAccess): ' + \$.CGPreflightScreenCaptureAccess() +
            ', accessibility (AXIsProcessTrusted): ' + \$.AXIsProcessTrusted() +
            ', on-screen windows: ' + list.length + ', of them with a readable title: ' + list.filter(function (w) { return w.kCGWindowName !== undefined; }).length" 2>&1 || echo "osascript failed"
          # the window server session of this process: NULL when it has none (e.g. a launchd job with SessionCreate), else
          # whether it is the console session and whether the screen is locked
          osascript -l JavaScript -e "ObjC.import('CoreGraphics');
            var d = ObjC.deepUnwrap(ObjC.castRefToObject(\$.CGSessionCopyCurrentDictionary()));
            d ? 'window server session: on console ' + d.kCGSSessionOnConsoleKey + ', screen locked ' + (d.CGSSessionScreenIsLocked ? true : false) +
                ', login done ' + d.kCGSessionLoginDoneKey : 'window server session: none'" 2>&1 || echo "osascript failed"
          echo "runner launch agents (SessionCreate, ProcessType):"
          for plist in "$HOME"/Library/LaunchAgents/actions.runner.*.plist; do
            [ -f "$plist" ] || { echo "    none (started by hand, e.g. ./run.sh in a terminal)"; continue; }
            echo "    SessionCreate=$(plutil -extract SessionCreate raw "$plist" 2>/dev/null || echo unset), ProcessType=$(plutil -extract ProcessType raw "$plist" 2>/dev/null || echo unset)"
          done
          echo "process chain of this step (names only):"
          pid=$$
          for _ in 1 2 3 4 5 6 7 8; do
            [ "$pid" -gt 1 ] || break
            echo "    $(ps -o comm= -p "$pid" | sed "s#^$HOME#~#")"
            pid="$(ps -o ppid= -p "$pid" | tr -d ' ')"
          done
          echo "~/.Trash readable: $(ls "$HOME/.Trash" >/dev/null 2>&1 && echo yes || echo 'no (no Full Disk Access)')"
          echo "~/Library/Logs/DiagnosticReports readable: $(ls "$HOME/Library/Logs/DiagnosticReports" >/dev/null 2>&1 && echo yes || echo no)"
          echo "mounted disk images: $(hdiutil info 2>/dev/null | grep -c '^image-path' || true)"
          echo "volumes named FreeFileSync*: $(ls -d /Volumes/FreeFileSync* 2>/dev/null | wc -l | tr -d ' ')"

      # FAT volumes: does macOS report native extended attributes for them (VOL_CAP_INT_EXTENDED_ATTR, what zen's
      # copyExtendedAttributes() asks), and does it put attributes (AppleDouble "._" files) on a file a process merely writes?
      # (macOS 27 showed "._" files in the FAT tests of Tests/zen and Tests/sync.) A disk image in $RUNNER_TEMP, detached after.
      - name: FAT volume and extended attributes
        run: |
          w="$RUNNER_TEMP/fat-probe"
          mkdir -p "$w/mnt"
          cat > "$w/caps.c" <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <sys/attr.h>
          #include <sys/mount.h>
          #include <unistd.h>
          int main(int argc, char** argv)
          {
              struct { uint32_t length; vol_capabilities_attr_t caps; } __attribute__((aligned(4), packed)) buf;
              struct attrlist al = { .bitmapcount = ATTR_BIT_MAP_COUNT, .volattr = ATTR_VOL_INFO | ATTR_VOL_CAPABILITIES };
              struct statfs st;
              if (statfs(argv[1], &st) != 0 || getattrlist(st.f_mntonname, &al, &buf, sizeof(buf), 0) != 0) { perror("statfs/getattrlist"); return 1; }
              const uint32_t bit = VOL_CAP_INT_EXTENDED_ATTR;
              printf("file system %s: VOL_CAP_INT_EXTENDED_ATTR valid %d, set %d\n", st.f_fstypename,
                     !!(buf.caps.valid[VOL_CAPABILITIES_INTERFACES] & bit), !!(buf.caps.capabilities[VOL_CAPABILITIES_INTERFACES] & bit));
              return 0;
          }
          EOF
          xcrun clang -o "$w/caps" "$w/caps.c"
          hdiutil create -quiet -size 32m -fs MS-DOS -volname PROBE "$w/fat.dmg"
          hdiutil attach -quiet -nobrowse -noverify -noautoopen -mountpoint "$w/mnt" "$w/fat.dmg"
          trap 'hdiutil detach -quiet -force "$w/mnt" || true' EXIT
          "$w/caps" "$w/mnt"
          "$w/caps" "$RUNNER_TEMP"
          printf 'content\n' > "$w/mnt/written.txt"     # written by this process only, no attributes set
          mkdir "$w/mnt/dir"
          echo "after a plain write: $(ls -A "$w/mnt" | tr '\n' ' ')"
          echo "attributes of the written file: $(xattr "$w/mnt/written.txt" | tr '\n' ' ')"
          echo "attributes of a folder made on it: $(xattr "$w/mnt/dir" | tr '\n' ' ')"
          printf 'x\n' > "$w/src.txt"
          echo "attributes a new file in \$RUNNER_TEMP gets: $(xattr "$w/src.txt" | tr '\n' ' ')"
          cat "$w/src.txt" > "$w/mnt/catcopy.txt"
          echo "after cat to the volume: $(ls -A "$w/mnt" | tr '\n' ' '); attributes: $(xattr "$w/mnt/catcopy.txt" | tr '\n' ' ')"
          # the same writes by a program built here (ad-hoc signed by the linker, like zen_test and sync_test), not by a system tool
          printf '#include <stdio.h>\nint main(int c, char** v) { for (int i = 1; i < c; ++i) { FILE* f = fopen(v[i], "w"); if (!f) return 1; fputs("x\\n", f); fclose(f); } return 0; }\n' > "$w/writer.c"
          xcrun clang -o "$w/writer" "$w/writer.c"
          "$w/writer" "$w/mnt/by-built-program.txt" "$w/by-built-program.txt"
          echo "file written by a program built here, on the volume: attributes: $(xattr "$w/mnt/by-built-program.txt" | tr '\n' ' '); now on the volume: $(ls -A "$w/mnt" | tr '\n' ' ')"
          echo "file written by a program built here, on APFS: attributes: $(xattr "$w/by-built-program.txt" | tr '\n' ' ')"
          echo "attributes of the program itself: $(xattr "$w/writer" | tr '\n' ' ')"
          # the zen test's image was mounted under the per-user temp folder (/var/folders/...), not under $RUNNER_TEMP: the same there
          v="$(env -u TMPDIR mktemp -d)"
          mkdir -p "$v/mnt"
          hdiutil create -quiet -size 32m -fs MS-DOS -volname PROBE2 "$v/fat.dmg"
          hdiutil attach -quiet -nobrowse -noverify -noautoopen -mountpoint "$v/mnt" "$v/fat.dmg"
          trap 'hdiutil detach -quiet -force "$w/mnt" || true; hdiutil detach -quiet -force "$v/mnt" || true; rm -rf "$v"' EXIT
          "$w/caps" "$v/mnt"
          "$w/writer" "$v/mnt/by-built-program.txt"
          printf 'x\n' > "$v/src.txt"; xattr -w com.freefilesync.probe value "$v/src.txt"
          cp -X "$v/src.txt" "$v/mnt/cp-X.txt" # cp without extended attributes
          echo "under the per-user temp folder, on the volume: $(ls -A "$v/mnt" | tr '\n' ' '); attributes: $(xattr "$v/mnt/by-built-program.txt" "$v/mnt/cp-X.txt" 2>&1 | tr '\n' ' ')"

      # bisection of the AppleDouble files the FAT tests of Tests/zen and Tests/sync find on macOS 27: zen's copy calls one at a
      # time (.github/build/probes/fat-metadata.c) on FAT and exFAT images, then the real zen test, which prints the attribute names
      - name: Which copy call leaves AppleDouble files on FAT
        run: |
          w="$(mktemp -d "$TMPDIR/fat-bisect.XXXXXX")"
          xcrun clang -o "$w/probe" .github/build/probes/fat-metadata.c
          printf 'content' > "$w/source.txt"
          xattr -w com.freefilesync.small 'zen value' "$w/source.txt"
          xattr -w com.freefilesync.big "$(head -c 200000 /dev/zero | tr '\0' a)" "$w/source.txt"
          mkdir "$w/sourceDir"; xattr -w com.freefilesync.small 'folder value' "$w/sourceDir"
          mounted=()
          trap 'for m in "${mounted[@]}"; do hdiutil detach -quiet -force "$m" || true; done' EXIT
          for fs in MS-DOS ExFAT; do
            mkdir -p "$w/mnt-$fs"
            hdiutil create -quiet -size 32m -fs "$fs" -volname "PROBE$fs" "$w/$fs.dmg"
            hdiutil attach -quiet -nobrowse -noverify -noautoopen -mountpoint "$w/mnt-$fs" "$w/$fs.dmg"
            mounted+=("$w/mnt-$fs")
            echo "== $fs"
            "$w/probe" "$w/source.txt" "$w/sourceDir" "$w/mnt-$fs"
          done
          echo "== Tests/zen fileAccessMacSecondVolume"
          bash Tests/zen/run.sh fileAccessMacSecondVolume 2>&1 | grep -E 'extended attributes on|AppleDouble|FAILED|== |failure' | sed "s#$RUNNER_TEMP#<runner temp>#g" || true

      # finding of the review of the runner change: an app started by a relative path must still be found by cleanup (it matches
      # the resolved executable path from lsof, and the command path from ps). Last but one: it runs cleanup, which removes
      # $RUNNER_TEMP's folders (TMPDIR among them)
      - name: Cleanup ends a process started from the checkout by a relative path
        run: |
          printf '#include <unistd.h>\nint main(void) { for (;;) pause(); }\n' > "$RUNNER_TEMP/ffs-ci-dummy.c"
          cd "$GITHUB_WORKSPACE"
          mkdir -p ffs-ci-dummy-dir/sub
          xcrun clang -o ffs-ci-dummy-dir/ffs-ci-dummy "$RUNNER_TEMP/ffs-ci-dummy.c"
          ( cd ffs-ci-dummy-dir/sub && exec ../ffs-ci-dummy ) &
          pid=$!
          sleep 1
          echo "started by a relative path: ps shows $(ps -o comm= -p "$pid" | sed "s#^$GITHUB_WORKSPACE/#<checkout>/#")"
          .github/build/mac-runner.sh cleanup
          sleep 1
          st="$(ps -o stat= -p "$pid" || true)"
          case "$st" in
            ("" | Z*) echo "cleanup ended it" ;;
            (*) echo "::error::cleanup did not end a process started from the checkout by a relative path"; kill -KILL "$pid"; exit 1 ;;
          esac

      - name: Clean up the self-hosted Mac
        if: always()
        run: .github/build/mac-runner.sh cleanup
