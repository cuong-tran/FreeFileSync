name: zen tests

#builds the zen platform layer (zen/*.cpp) with the unit tests in Tests/zen and runs them
#matrix: g++ and clang + libc++ on Ubuntu; Xcode's clang on macOS for arm64 and x86_64 (cross-compiled on the arm64 runner, run under
#Rosetta 2); Windows gets its own entries once zen builds there (see docs/PORTING_PLAN.md). The macOS entries run on the owner's
#self-hosted Mac, except for pull requests from forks (see runs-on and CONTRIBUTING.md, "Self-hosted macOS runner")
on:
  push:
    branches: [dev, main] #other branches: through their pull request (or run by hand), so a PR push doesn't test the same commit twice
    paths:
      - 'zen/**'
      - 'Tests/zen/**'
      - '.github/workflows/zen-tests.yml'
      - '.github/build/common.sh' #FFS_MACOS_DEPLOYMENT_TARGET
      - '.github/build/mac-runner.sh' #macOS runner setup and cleanup
      - '.github/build/select-xcode.sh'
  pull_request:
    paths:
      - 'zen/**'
      - 'Tests/zen/**'
      - '.github/workflows/zen-tests.yml'
      - '.github/build/common.sh' #FFS_MACOS_DEPLOYMENT_TARGET
      - '.github/build/mac-runner.sh' #macOS runner setup and cleanup
      - '.github/build/select-xcode.sh'
  workflow_dispatch:

concurrency: #like the other workflows: a newer push cancels the run it supersedes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zen-tests:
    name: zen tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, g++
            platform: ubuntu
            runner: ubuntu-24.04
            container: gcc:15 #FreeFileSync 14.13 is built with -std=c++26
            cxx: g++
            stdlib: ''
          - name: ubuntu, clang + libc++ #the compiler and C++ library of the macOS and Windows ports
            platform: ubuntu
            runner: ubuntu-24.04
            container: ''
            cxx: clang++-20
            stdlib: libc++
          - name: macOS arm64
            platform: macos
            runner: macos-15
            container: ''
            cxx: clang++ #Xcode's clang (newest Xcode 26.x, selected below) with Apple's libc++
            stdlib: ''
            arch: arm64
          - name: macOS x86_64
            platform: macos
            runner: macos-15 #arm64 runner: cross-compiled with -arch x86_64, run under Rosetta 2
            container: ''
            cxx: clang++
            stdlib: ''
            arch: x86_64
    #macOS entries: the owner's self-hosted Mac for trusted events (push, manual run, pull request from this repository) unless the
    #repository variable MACOS_RUNNER is "hosted"; GitHub's macos-15 (matrix.runner) for pull requests from forks. See
    #"Self-hosted macOS runner" in CONTRIBUTING.md
    runs-on: ${{ matrix.platform == 'macos' && ((vars.MACOS_RUNNER != 'hosted' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && fromJSON('["self-hosted","macOS"]') || matrix.runner) || matrix.runner }}
    #entries without a container run directly on the runner; the g++ entry runs as root in its container, the clang entry as the
    #unprivileged runner user, which covers both code paths where zen treats root differently (e.g. sys_info.cpp)
    container: ${{ matrix.container }}
    timeout-minutes: 30
    env:
      CXX: ${{ matrix.cxx }}
      STDLIB: ${{ matrix.stdlib }}
      ARCH: ${{ matrix.arch }} #macOS only
      ZEN_TEST_ALL_ERRORS: 1 #a failed build reports all errors of each file, not just the first
    steps:
      #self-hosted: the user, host and computer names are masked in the log before anything prints a path (actions/checkout
      #prints the work folder, which is in the home folder); a copy of mac-runner.sh's list, which can't run before the checkout
      - name: Mask private names (self-hosted)
        if: matrix.platform == 'macos' && runner.environment == 'self-hosted'
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          for v in "$(id -un)" "$(id -F 2>/dev/null || true)" "$(hostname -s 2>/dev/null || true)" "$(hostname 2>/dev/null || true)" \
                   "$(scutil --get ComputerName 2>/dev/null || true)" "$(scutil --get LocalHostName 2>/dev/null || true)"; do
            if [ "${#v}" -ge 3 ]; then echo "::add-mask::$v"; fi
          done
      - uses: actions/checkout@v4
      - name: Install dependencies (gcc container)
        if: matrix.platform == 'ubuntu' && matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends libglib2.0-dev pkg-config
      - name: Install dependencies (runner)
        if: matrix.platform == 'ubuntu' && matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-20 libc++-20-dev libc++abi-20-dev libglib2.0-dev pkg-config
      #self-hosted: masks private names, checks the tools (installs nothing), TMPDIR into $RUNNER_TEMP
      - name: Prepare the runner (macOS)
        if: matrix.platform == 'macos'
        run: .github/build/mac-runner.sh setup bash
      - name: Select Xcode
        if: ${{ !cancelled() && matrix.platform == 'macos' }} #also after a failed setup: one run lists everything missing
        run: .github/build/select-xcode.sh --github-env
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos' && runner.environment == 'github-hosted'
        run: brew list bash >/dev/null 2>&1 || brew install bash #run.sh needs bash 4.4+ (macOS ships 3.2)
      - name: Tools (macOS)
        if: matrix.platform == 'macos'
        run: |
          bash --version | sed -n 1p
          clang++ --version | sed -n 1p
      #x86_64 test binaries run under Rosetta 2 (installed on GitHub's runners if missing; never on the self-hosted Mac), arm64 ones
      #only on Apple silicon; otherwise the entry only compiles
      - name: Rosetta 2
        if: matrix.platform == 'macos'
        run: |
          if ! arch -"$ARCH" /usr/bin/true 2>/dev/null && [ "$ARCH" = x86_64 ] && [ "${{ runner.environment }}" = github-hosted ]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          if arch -"$ARCH" /usr/bin/true 2>/dev/null; then
            echo "$ARCH binaries run on this Mac"
          else
            echo "::warning::$ARCH binaries do not run on this Mac ($(uname -m)$([ "$ARCH" = x86_64 ] && echo ', no Rosetta 2')): the zen tests are compiled only"
            echo "ZEN_TEST_COMPILE_ONLY=1" >> "$GITHUB_ENV"
          fi
      - name: Build and run zen tests
        run: ZEN_TEST_BIN="$RUNNER_TEMP/zen-test-bin" bash Tests/zen/run.sh
      #FSEvents delivers events asynchronously and coalesces them: the watcher test must be reliable, not just pass once
      - name: dirWatcher test 20 times (macOS)
        if: matrix.platform == 'macos' && env.ZEN_TEST_COMPILE_ONLY != '1'
        run: |
          mkdir -p "$RUNNER_TEMP/zen-test-root"
          for i in $(seq 1 20); do
            "$RUNNER_TEMP/zen-test-bin/zen_test" --root "$RUNNER_TEMP/zen-test-root" dirWatcher > "$RUNNER_TEMP/dw.log" 2>&1 ||
              { cat "$RUNNER_TEMP/dw.log"; echo "::error::dirWatcher failed in run $i of 20"; exit 1; }
          done
          tail -n 1 "$RUNNER_TEMP/dw.log"
          echo "dirWatcher: 20 of 20 runs passed"

      #self-hosted: what the tests left (disk images, trash items, crash reports, processes), build output, old cache entries
      - name: Clean up the self-hosted Mac
        if: always() && matrix.platform == 'macos' && runner.environment == 'self-hosted'
        run: .github/build/mac-runner.sh cleanup
