name: zen tests

#builds the zen platform layer (zen/*.cpp) with the unit tests in Tests/zen and runs them
#matrix: g++ and clang + libc++ on Ubuntu; Xcode's clang on macOS for arm64 and x86_64 (cross-compiled on the arm64 runner, run under
#Rosetta 2); Windows gets its own entries once zen builds there (see docs/PORTING_PLAN.md)
on:
  push:
    branches: [dev, main] #other branches: through their pull request (or run by hand), so a PR push doesn't test the same commit twice
    paths:
      - 'zen/**'
      - 'Tests/zen/**'
      - '.github/workflows/zen-tests.yml'
  pull_request:
    paths:
      - 'zen/**'
      - 'Tests/zen/**'
      - '.github/workflows/zen-tests.yml'
  workflow_dispatch:

concurrency: #like the other workflows: a newer push cancels the run it supersedes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zen-tests:
    name: zen tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, g++
            platform: ubuntu
            runner: ubuntu-24.04
            container: gcc:15 #FreeFileSync 14.13 is built with -std=c++26
            cxx: g++
            stdlib: ''
          - name: ubuntu, clang + libc++ #the compiler and C++ library of the macOS and Windows ports
            platform: ubuntu
            runner: ubuntu-24.04
            container: ''
            cxx: clang++-20
            stdlib: libc++
          - name: macOS arm64
            platform: macos
            runner: macos-15
            container: ''
            cxx: clang++ #Xcode's clang (newest Xcode 26.x, selected below) with Apple's libc++
            stdlib: ''
            arch: arm64
          - name: macOS x86_64
            platform: macos
            runner: macos-15 #arm64 runner: cross-compiled with -arch x86_64, run under Rosetta 2
            container: ''
            cxx: clang++
            stdlib: ''
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    #entries without a container run directly on the runner; the g++ entry runs as root in its container, the clang entry as the
    #unprivileged runner user, which covers both code paths where zen treats root differently (e.g. sys_info.cpp)
    container: ${{ matrix.container }}
    timeout-minutes: 30
    env:
      CXX: ${{ matrix.cxx }}
      STDLIB: ${{ matrix.stdlib }}
      ARCH: ${{ matrix.arch }} #macOS only
      ZEN_TEST_ALL_ERRORS: 1 #a failed build reports all errors of each file, not just the first
      #M3 step 1: dir_watcher and recycler are not implemented on macOS yet (their tests are NOT_PORTED_YET_TEST_CASE)
      ZEN_TEST_ALLOW_NOT_PORTED: ${{ matrix.platform == 'macos' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (gcc container)
        if: matrix.platform == 'ubuntu' && matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends libglib2.0-dev pkg-config
      - name: Install dependencies (runner)
        if: matrix.platform == 'ubuntu' && matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-20 libc++-20-dev libc++abi-20-dev libglib2.0-dev pkg-config
      - name: Select Xcode
        if: matrix.platform == 'macos'
        run: |
          xcode="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26.x on this runner image; installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "using $xcode"
      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash #run.sh needs bash 4.3+ (macOS ships 3.2)
          bash --version | sed -n 1p
          clang++ --version | sed -n 1p
      #x86_64 test binaries run under Rosetta 2; without it (and if it can't be installed), the entry only compiles
      - name: Rosetta 2
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 available"
          else
            echo "::warning::Rosetta 2 not available on this runner: x86_64 zen tests are compiled only"
            echo "ZEN_TEST_COMPILE_ONLY=1" >> "$GITHUB_ENV"
          fi
      - name: Build and run zen tests
        run: bash Tests/zen/run.sh
