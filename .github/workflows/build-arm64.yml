name: Build Linux ARM64

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WX_VERSION: 3.3.4
  WX_SHA256: 815c16cafa4fcbfcf25c5c0a3418309c62257b8a3b6f91d85a1367a134f98c98
  # passed via the environment: "make CXX=..." would override the makefiles' "CXX += -pthread"
  CC: gcc-14
  CXX: g++-14

jobs:
  build-arm64:
    name: Build on Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          g++-14 make pkg-config dpkg-dev unzip \
          libgtk-3-dev libssl-dev libcurl4-openssl-dev \
          libidn2-dev libssh2-1-dev libselinux1-dev

    - name: Set wxWidgets install path
      run: echo "WX_PREFIX=${HOME}/wx-install" >> "${GITHUB_ENV}"

    - name: Restore wxWidgets build
      id: wx-cache
      uses: actions/cache@v4
      with:
        path: ~/wx-install
        key: wx-${{ env.WX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-arm64.yml') }}

    # FreeFileSync needs wxWidgets 3.3 with the wxColorHook patch from Bugs.txt and without
    # wxWidgets' own exception handling (application.cpp refuses to build if wxUSE_EXCEPTIONS is set)
    - name: Build wxWidgets ${{ env.WX_VERSION }}
      if: steps.wx-cache.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        curl -fsSLo wx.tar.bz2 "https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2"
        echo "${WX_SHA256}  wx.tar.bz2" | sha256sum -c -
        tar xf wx.tar.bz2
        cd "wxWidgets-${WX_VERSION}"

        echo '=== Applying the wxColorHook patch from Bugs.txt to include/wx/settings.h ==='
        python3 -I - include/wx/settings.h <<'EOF'
        import sys
        path = sys.argv[1]
        src = open(path).read()

        def insert(anchor, before='', after=''):
            global src
            if src.count(anchor) != 1:
                sys.exit(f'patch anchor not found exactly once: {anchor!r}')
            src = src.replace(anchor, before + anchor + after)

        insert('#include "wx/font.h"\n', after='#include <memory>\n')
        insert('class WXDLLIMPEXP_CORE wxSystemSettings : public wxSystemSettingsNative\n{\npublic:\n',
               before='struct wxColorHook\n'
                      '{\n'
                      '    virtual ~wxColorHook() {}\n'
                      '    virtual wxColor getColor(wxSystemColour index) const = 0;\n'
                      '};\n'
                      'WXDLLIMPEXP_CORE inline std::unique_ptr<wxColorHook>& refGlobalColorHook()\n'
                      '{\n'
                      '    static std::unique_ptr<wxColorHook> globalColorHook;\n'
                      '    return globalColorHook;\n'
                      '}\n\n',
               after='    static wxColour GetColour(wxSystemColour index)\n'
                     '    {\n'
                     '        if (refGlobalColorHook())\n'
                     '            return refGlobalColorHook()->getColor(index);\n'
                     '\n'
                     '        return wxSystemSettingsNative::GetColour(index);\n'
                     '    }\n\n')
        open(path, 'w').write(src)
        EOF

        ./configure \
          --prefix="${WX_PREFIX}" \
          --disable-shared \
          --with-gtk=3 \
          --disable-exceptions \
          --disable-stc \
          --disable-webview \
          --disable-mediactrl \
          --without-opengl
        make -j"$(nproc)"
        make install

    - name: Build FreeFileSync and RealTimeSync
      run: |
        set -euo pipefail
        export PATH="${WX_PREFIX}/bin:${PATH}"
        echo "Using $(command -v wx-config), wxWidgets $(wx-config --version)"
        make -C FreeFileSync/Source -j"$(nproc)"
        make -C FreeFileSync/Source/RealTimeSync -j"$(nproc)"
        ls -l FreeFileSync/Build/Bin

    - name: Create DEB package
      run: |
        set -euo pipefail
        ffsVersion=$(sed -n 's/^const char ffsVersion\[\] = "\([^"]*\)".*/\1/p' FreeFileSync/Source/version/version.h)
        test -n "${ffsVersion}"
        debArch=$(dpkg --print-architecture)
        debVersion="${ffsVersion}+ci${GITHUB_RUN_NUMBER}"
        arch=$(arch)

        pkg="${RUNNER_TEMP}/deb"
        rm -rf "${pkg}"
        mkdir -p "${pkg}/DEBIAN" "${pkg}/opt/FreeFileSync" "${pkg}/usr/bin" \
                 "${pkg}/usr/share/applications" "${pkg}/usr/share/pixmaps"

        # FreeFileSync looks for its Resources folder next to the Bin folder of the executable
        cp -r FreeFileSync/Build/Bin FreeFileSync/Build/Resources "${pkg}/opt/FreeFileSync/"
        ln -s "/opt/FreeFileSync/Bin/FreeFileSync_${arch}" "${pkg}/usr/bin/freefilesync"
        ln -s "/opt/FreeFileSync/Bin/RealTimeSync_${arch}" "${pkg}/usr/bin/realtimesync"
        unzip -p FreeFileSync/Build/Resources/Icons.zip FreeFileSync.png > "${pkg}/usr/share/pixmaps/freefilesync.png"
        unzip -p FreeFileSync/Build/Resources/Icons.zip RealTimeSync.png > "${pkg}/usr/share/pixmaps/realtimesync.png"

        printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=FreeFileSync' \
          'Comment=Folder Comparison and Synchronization' 'Exec=/usr/bin/freefilesync %F' \
          'Icon=freefilesync' 'Terminal=false' 'Categories=Utility;FileTools;' \
          > "${pkg}/usr/share/applications/freefilesync.desktop"
        printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=RealTimeSync' \
          'Comment=Automated Synchronization' 'Exec=/usr/bin/realtimesync %F' \
          'Icon=realtimesync' 'Terminal=false' 'Categories=Utility;FileTools;' \
          > "${pkg}/usr/share/applications/realtimesync.desktop"

        # let dpkg-shlibdeps work out the shared library dependencies (wxWidgets is linked statically)
        shlibsDir="${RUNNER_TEMP}/shlibs"
        mkdir -p "${shlibsDir}/debian"
        echo 'Source: freefilesync' > "${shlibsDir}/debian/control"
        depends=$(cd "${shlibsDir}" && dpkg-shlibdeps -O "${pkg}"/opt/FreeFileSync/Bin/* | sed -n 's/^shlibs:Depends=//p')
        test -n "${depends}"

        cat > "${pkg}/DEBIAN/control" <<EOF
        Package: freefilesync
        Version: ${debVersion}
        Section: utils
        Priority: optional
        Architecture: ${debArch}
        Depends: ${depends}
        Maintainer: ${GITHUB_REPOSITORY_OWNER} <noreply@github.com>
        Homepage: https://github.com/${GITHUB_REPOSITORY}
        Description: Folder comparison and synchronization (unofficial build)
         FreeFileSync and RealTimeSync built from https://github.com/${GITHUB_REPOSITORY}
         at commit ${GITHUB_SHA}.
        EOF
        cat "${pkg}/DEBIAN/control"

        mkdir -p dist
        dpkg-deb --build --root-owner-group "${pkg}" "dist/freefilesync_${debVersion}_${debArch}.deb"
        tar -C FreeFileSync/Build -czf "dist/FreeFileSync_${ffsVersion}_Linux_${arch}.tar.gz" Bin Resources
        ls -l dist

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: freefilesync-linux-arm64
        path: dist/*
        retention-days: 30
