name: ZIP AFS test

#builds the read-only ZIP AbstractFileSystem (FreeFileSync/Source/afs/zip.cpp) with its zen dependencies and runs Tests/zip_afs against archives made by Python zipfile and Info-ZIP
on:
  push:
    branches: [dev, main] #other branches: through their pull request (or run by hand), so a PR push doesn't test the same commit twice
    paths:
      - 'FreeFileSync/Source/afs/**'
      - 'zen/**'
      - 'Tests/zip_afs/**'
      - '.github/workflows/zip-sync.yml'
  pull_request:
    paths:
      - 'FreeFileSync/Source/afs/**'
      - 'zen/**'
      - 'Tests/zip_afs/**'
      - '.github/workflows/zip-sync.yml'
  workflow_dispatch:

concurrency: #like the Linux build workflows: a newer push cancels the run it supersedes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zip-afs-test:
    name: ZIP AFS test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g++
            container: gcc:15 #FreeFileSync 14.13 is built with -std=c++26
            cxx: g++
            stdlib: ''
          - name: clang + libc++ #the compiler and C++ library of the macOS and Windows ports
            container: ''
            cxx: clang++-20
            stdlib: libc++
    runs-on: ubuntu-24.04
    #entries without a container run directly on the runner; the g++ entry runs as root in its container, the clang entry as the
    #unprivileged runner user, so both are covered
    container: ${{ matrix.container }}
    env:
      CXX: ${{ matrix.cxx }}
      STDLIB: ${{ matrix.stdlib }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (gcc container)
        if: matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends zlib1g-dev libglib2.0-dev pkg-config zip python3
      - name: Install dependencies (runner)
        if: matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-20 libc++-20-dev libc++abi-20-dev zlib1g-dev libglib2.0-dev pkg-config zip python3
      - name: Build and run ZIP tests
        run: bash Tests/zip_afs/run.sh
