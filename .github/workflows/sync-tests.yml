name: sync tests

#builds the engine (libffs_engine.a, "make engine") and runs the headless sync tests in Tests/sync against it: real comparisons and
#synchronizations of temporary folder trees (mirror, update, two-way with the database, filters, versioning, recycle bin, symlinks,
#permissions, errors, ZIP source; on macOS also extended attributes and a FAT disk image).
#matrix: g++ and clang + libc++ on Ubuntu, Xcode's clang on macOS for arm64 and x86_64 (cross-compiled on the arm64 runner, run under
#Rosetta 2). The libraries come from the caches of the build workflows (same keys; built here on a miss), compiler output from ccache.
#The macOS entries run on the owner's self-hosted Mac, except for pull requests from forks (see runs-on and CONTRIBUTING.md).
on:
  push:
    branches: [dev, main] #other branches: through their pull request (or run by hand), so a PR push doesn't test the same commit twice
    paths: &test-paths
      - 'FreeFileSync/Source/**'
      - '!FreeFileSync/Source/ui/**'
      - '!FreeFileSync/Source/RealTimeSync/**'
      - 'FreeFileSync/Source/ui/file_grid_attr.h' #ui headers the engine compiles: config.h includes them
      - 'FreeFileSync/Source/ui/tree_grid_attr.h'
      - 'FreeFileSync/Source/ui/cfg_grid.h'
      - 'zen/**'
      - 'zenXml/**'
      - 'libcurl/**'
      - 'libssh2/**'
      - 'wx+/**' #headers of config.h, icon_buffer.cpp and afs/abstract.h (image_holder.h)
      - 'Tests/sync/**'
      - 'Tests/zen/test.h'
      - '.github/build/**'
      - 'Bugs.txt'
      - '.github/workflows/sync-tests.yml'
  pull_request:
    paths: *test-paths
  workflow_dispatch:

concurrency: #like the other workflows: a newer push cancels the run it supersedes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-tests:
    name: sync tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, g++
            platform: ubuntu
            runner: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            stdlib: ''
          - name: ubuntu, clang + libc++ #the compiler and C++ library of the macOS and Windows ports
            platform: ubuntu
            runner: ubuntu-24.04
            cc: clang-20
            cxx: clang++-20
            stdlib: libc++
          - name: macOS arm64
            platform: macos
            runner: macos-15
            cc: clang
            cxx: clang++ #Xcode's clang (newest Xcode 26.x, selected below) with Apple's libc++
            stdlib: ''
            arch: arm64
          - name: macOS x86_64
            platform: macos
            runner: macos-15 #arm64 runner: cross-compiled with -arch x86_64, run under Rosetta 2
            cc: clang
            cxx: clang++
            stdlib: ''
            arch: x86_64
    #macOS entries: the owner's self-hosted Mac for trusted events (push, manual run, pull request from this repository) unless the
    #repository variable MACOS_RUNNER is "hosted"; GitHub's macos-15 (matrix.runner) for pull requests from forks. See
    #"Self-hosted macOS runner" in CONTRIBUTING.md
    runs-on: ${{ matrix.platform == 'macos' && ((vars.MACOS_RUNNER != 'hosted' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && fromJSON('["self-hosted","macOS"]') || matrix.runner) || matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      STDLIB: ${{ matrix.stdlib }}
      ARCH: ${{ matrix.arch }} #macOS only
      FFS_TARGET: ${{ matrix.platform == 'macos' && format('macos-{0}', matrix.arch) || 'linux' }}
      WX_FLAGS: -stdlib=libc++ #clang + libc++ entry: CXXFLAGS and LDFLAGS for its wxWidgets build (part of the linux-build.yml cache key)
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      SYNC_TEST_OBJ: ${{ github.workspace }}/.build/sync-test-obj
    steps:
      - uses: actions/checkout@v4

      #---------------------------------------------------------------- Linux
      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 clang-20 libc++-20-dev libc++abi-20-dev make cmake pkg-config perl patch curl xz-utils bzip2 \
            libgtk-3-dev libxtst-dev libidn2-dev zlib1g-dev libselinux1-dev libssl-dev libcurl4-openssl-dev python3 ccache

      #the same keys as linux-build.yml's Packages (x86_64) and clang + libc++ jobs, so their caches are shared
      - name: Restore libraries (Linux)
        if: matrix.platform == 'ubuntu'
        id: cache-linux
        uses: actions/cache/restore@v4
        with:
          path: .build/deps
          key: ${{ matrix.stdlib == 'libc++'
            && format('deps-{0}-{1}-{2}-ubuntu-24.04-x86_64-{3}', env.CC, env.CXX, env.WX_FLAGS, hashFiles('.github/build/common.sh', '.github/build/build-libssh2.sh', '.github/build/build-wxwidgets.sh', '.github/build/patches/**'))
            || format('deps-ubuntu-24.04-x86_64-gcc14-{0}', hashFiles('.github/build/common.sh', '.github/build/build.sh', '.github/build/build-openssl.sh', '.github/build/build-libssh2.sh', '.github/build/build-curl.sh', '.github/build/build-wxwidgets.sh', '.github/build/patches/**')) }}

      - name: Build libraries (Linux)
        if: matrix.platform == 'ubuntu' && steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          if [ "$STDLIB" = libc++ ]; then #libssh2 and wxWidgets only, against the system's OpenSSL and libcurl (as linux-build.yml)
            .github/build/build-libssh2.sh
            CXXFLAGS="$WX_FLAGS" LDFLAGS="$WX_FLAGS" .github/build/build-wxwidgets.sh
          else
            .github/build/build.sh
          fi

      - name: Save libraries (Linux)
        if: matrix.platform == 'ubuntu' && steps.cache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/deps
          key: ${{ steps.cache-linux.outputs.cache-primary-key }}

      #---------------------------------------------------------------- macOS
      #self-hosted: masks private names, checks the tools (installs nothing; ccache is optional there), TMPDIR into $RUNNER_TEMP,
      #compiler paths without the home folder
      - name: Prepare the runner (macOS)
        if: matrix.platform == 'macos'
        id: runner
        run: .github/build/mac-runner.sh setup bash build python3 ccache

      - name: Select Xcode
        if: ${{ !cancelled() && matrix.platform == 'macos' }} #also after a failed setup: one run lists everything missing
        run: .github/build/select-xcode.sh --github-env

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos' && runner.environment == 'github-hosted'
        run: brew install bash coreutils flock pkgconf make ccache #bash 4.4+, GNU make 4 ("gmake"), and the tools of the .github/build scripts

      - name: Tools (macOS)
        if: matrix.platform == 'macos'
        run: |
          bash --version | sed -n 1p
          gmake --version | sed -n 1p

      - name: Identify the compiler (macOS)
        if: matrix.platform == 'macos'
        id: compiler
        run: echo "id=$(clang++ --version | sed -n 1p | tr -c 'A-Za-z0-9.\n' '-')-sdk$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"

      #the same key as macos-build.yml's Libraries job, so its cache is shared (self-hosted: the same local cache entries, "-fpm")
      - name: Cache key (macOS)
        if: matrix.platform == 'macos'
        id: keys
        env:
          DEPS_KEY: deps-macos-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('.github/build/common.sh', '.github/build/build.sh', '.github/build/build-openssl.sh', '.github/build/build-libssh2.sh', '.github/build/build-libidn2.sh', '.github/build/build-curl.sh', '.github/build/build-wxwidgets.sh', '.github/build/patches/**') }}
        run: echo "deps=$DEPS_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore libraries (macOS)
        if: matrix.platform == 'macos' && runner.environment == 'github-hosted'
        id: cache-macos
        uses: actions/cache/restore@v4
        with:
          path: .build/deps/macos-${{ matrix.arch }}
          key: ${{ steps.keys.outputs.deps }}

      - name: Restore libraries (macOS, local cache)
        if: matrix.platform == 'macos' && runner.environment == 'self-hosted'
        id: lcache-macos
        run: .github/build/mac-runner.sh cache restore "${{ steps.keys.outputs.deps }}-fpm" .build/deps/macos-${{ matrix.arch }}

      - name: Build libraries (macOS)
        if: matrix.platform == 'macos' && steps.cache-macos.outputs.cache-hit != 'true' && steps.lcache-macos.outputs.hit != 'true'
        run: |
          .github/build/build.sh
          [ "${{ runner.environment }}" != self-hosted ] || rm -rf .build/src .build/tmp # sources and build trees: GBs on the owner's disk

      - name: Save libraries (macOS)
        if: matrix.platform == 'macos' && runner.environment == 'github-hosted' && steps.cache-macos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/deps/macos-${{ matrix.arch }}
          key: ${{ steps.cache-macos.outputs.cache-primary-key }}

      - name: Save libraries (macOS, local cache)
        if: matrix.platform == 'macos' && runner.environment == 'self-hosted' && steps.lcache-macos.outputs.hit != 'true'
        run: .github/build/mac-runner.sh cache save deps-macos-${{ matrix.arch }} "${{ steps.keys.outputs.deps }}-fpm" .build/deps/macos-${{ matrix.arch }}

      #x86_64 test binaries run under Rosetta 2 (installed on GitHub's runners if missing; never on the self-hosted Mac), arm64 ones
      #only on Apple silicon; otherwise the entry only compiles
      - name: Rosetta 2
        if: matrix.platform == 'macos'
        run: |
          if ! arch -"$ARCH" /usr/bin/true 2>/dev/null && [ "$ARCH" = x86_64 ] && [ "${{ runner.environment }}" = github-hosted ]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          if arch -"$ARCH" /usr/bin/true 2>/dev/null; then
            echo "$ARCH binaries run on this Mac"
          else
            echo "::warning::$ARCH binaries do not run on this Mac ($(uname -m)$([ "$ARCH" = x86_64 ] && echo ', no Rosetta 2')): the sync tests are compiled only"
            echo "SYNC_TEST_COMPILE_ONLY=1" >> "$GITHUB_ENV"
          fi

      #---------------------------------------------------------------- both
      #compiler output across runs: make rebuilds every object of a fresh checkout (new time stamps), ccache makes that cheap.
      #Self-hosted: a persistent ccache folder next to the checkout instead (ccache keeps it at CCACHE_MAXSIZE), used only if the
      #owner has ccache installed
      - name: Restore ccache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-sync-${{ matrix.runner }}-${{ matrix.cxx }}${{ matrix.stdlib }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-sync-${{ matrix.runner }}-${{ matrix.cxx }}${{ matrix.stdlib }}-${{ matrix.arch }}-

      - name: Build and run sync tests
        run: |
          start=$SECONDS
          if [ "${{ runner.environment }}" = self-hosted ]; then #set here: the job's env (CCACHE_DIR) wins over $GITHUB_ENV
            export CCACHE_DIR="$RUNNER_WORKSPACE/ffs-ci-cache/ccache-sync-$ARCH"
          fi
          if command -v ccache >/dev/null; then
            ccache --zero-stats > /dev/null
            #ccache as a compiler wrapper: the makefile detects the compiler family through it ($(CXX) -dM -E)
            CXX="ccache $CXX" bash Tests/sync/run.sh
            echo "Tests/sync: $((SECONDS - start)) s"
            ccache --show-stats | sed -n '1,12p'
          else #the self-hosted Mac without ccache
            bash Tests/sync/run.sh
            echo "Tests/sync: $((SECONDS - start)) s (no ccache)"
          fi

      - name: Save ccache
        if: always() && runner.environment == 'github-hosted'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-sync-${{ matrix.runner }}-${{ matrix.cxx }}${{ matrix.stdlib }}-${{ matrix.arch }}-${{ github.sha }}

      #self-hosted: what the tests left (disk images, trash items, crash reports, processes), build output, old cache entries
      - name: Clean up the self-hosted Mac
        if: always() && matrix.platform == 'macos' && runner.environment == 'self-hosted'
        run: .github/build/mac-runner.sh cleanup
